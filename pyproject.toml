[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-document-agent"
version = "0.1.0"
description = "Local, evidence-preserving PDF and image preprocessing MVP"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.47,<2", "pdfplumber>=0.11,<0.12", "pypdfium2>=4.30,<6",
  "opencv-python-headless>=4.10,<5", "Pillow>=11,<13", "pytesseract>=0.3.13,<0.4",
  "numpy>=2,<3", "pillow-heif>=1.0,<2"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]
[project.scripts]
docagent = "docagent.cli:main"
[tool.setuptools.packages.find]
include = ["docagent*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
